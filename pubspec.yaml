name: kpss_soru_bankasi
description: "KPSS Çözümlü Soru Bankası - Modern ve Akıcı Mobil Sınav Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  crypto: ^3.0.7
  cryptography: ^2.9.0
  pdf: ^3.13.1
  printing: ^5.15.1
  http: ^1.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/tarih_questions.json
    - assets/data/turkce_questions.json
    - assets/data/matematik_questions.json
    - assets/data/cografya_questions.json
    - assets/data/vatandaslik_questions.json
    - assets/data/denemeler.json
    - assets/data/bomb_questions.json
    - assets/data/clue_questions.json
    - assets/data/matching_questions.json
    - assets/data/mantik_questions.json
    - assets/data/sayisal_mantik_questions.json
    - assets/images/geometry/
    - assets/images/geometry/custom_examples/
    - assets/images/geometri/
    - assets/images/matematik/
    - assets/images/charts/
    - assets/images/cografya/
    - assets/images/cografya/q_maps/
    - assets/images/cografyaharita/
    - assets/images/maps/
    - assets/images/tarih/
    - assets/images/vatandaslik/
    - assets/icon/
    - assets/fonts/
